# File:     stratum-tools/Cargo.toml
# Project:  Stratum Core
# Author:   Jacob Chacko
#
# The tools every part of Stratum shares, as a library.  The Launcher uses
# them, and so will the networking.

[package]
name = "stratum-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"